<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meditation Timer</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  <link rel="apple-touch-icon" href="icon-192.png">
  <!-- Marked.js per il rendering pulito del Markdown delle pratiche -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --accent: #d4af37;
      --accent-muted: #8a7322;
      --text: #e0e0e0;
      --text-muted: #a0a0a0;
      --prep-color: #e67e22;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 300;
      letter-spacing: 2px;
      color: var(--accent);
    }

    .badge {
      display: inline-block;
      margin-top: 5px;
      padding: 4px 12px;
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid var(--accent-muted);
      border-radius: 20px;
      font-size: 0.8rem;
      color: var(--accent);
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .timer-display {
      position: relative;
      width: 240px;
      height: 240px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .progress-ring {
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }

    .progress-ring-circle {
      stroke: var(--accent);
      stroke-dasharray: 691;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear, stroke 0.3s ease;
    }

    .timer-text {
      position: absolute;
      text-align: center;
    }

    .time-left {
      font-size: 2.5rem;
      font-weight: 200;
      letter-spacing: 1px;
    }

    .phase-label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-top: 5px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 15px;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    select, input {
      width: 100%;
      padding: 10px;
      background-color: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    select:focus, input:focus {
      border-color: var(--accent);
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background-color: var(--accent);
      color: #000;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      background-color: #333;
      color: var(--text);
      margin-top: 8px;
    }

    /* Stili per la Guida Pratica */
    .practice-controls {
      display: flex;
      gap: 8px;
    }

    .guide-box {
      display: none;
      margin-top: 15px;
      padding: 15px;
      background-color: #252525;
      border-left: 3px solid var(--accent);
      border-radius: 4px;
      max-height: 250px;
      overflow-y: auto;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .guide-box h2, .guide-box h3 {
      color: var(--accent);
      margin: 10px 0 5px 0;
    }

    .guide-box ul {
      margin-left: 20px;
      margin-bottom: 10px;
    }

    .hidden {
      display: none !important;
    }
    .footer-text {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 20px;
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>MEDITATION TIMER</h1>
      <div id="statsBadge" class="badge">Totale meditato: 0h 0m</div>
    </header>
    <footer class="footer-text">
      ABC della meditazione - Modulo C - ILTK Pomaia
    </footer>

    <!-- Sezione Selezione Pratica -->
    <div class="card">
      <div class="control-group">
        <label for="practiceSelect">Scegli una pratica</label>
        <div class="practice-controls">
          <select id="practiceSelect">
            <option value="0">-- Meditazione libera (solo timer) --</option>
          </select>
        </div>
      </div>
      <button id="toggleGuideBtn" class="btn btn-secondary hidden" onclick="toggleGuide()">Mostra testo guida</button>
      <div id="guideBox" class="guide-box"></div>
    </div>

    <!-- Timer e Visualizzazione -->
    <div class="card">
      <div class="timer-display">
        <svg class="progress-ring" width="230" height="230">
          <circle class="progress-ring-circle" id="progressRing" stroke-width="6" fill="transparent" r="110" cx="115" cy="115"/>
        </svg>
        <div class="timer-text">
          <div id="timeLeft" class="time-left">10:00</div>
          <div id="phaseLabel" class="phase-label">Pronto</div>
        </div>
      </div>
    </div>

    <!-- Controlli Timer -->
    <div id="setupControls" class="card">
      <div class="control-group">
        <label for="totalTime">Tempo totale (minuti):</label>
        <input type="number" id="totalTime" min="1" max="180" value="10">
      </div>

      <div class="control-group">
        <label for="prepTime">Tempo di preparazione (secondi, max 20%):</label>
        <input type="number" id="prepTime" min="0" step="10" value="60">
      </div>

      <div class="control-group">
        <label for="intervals">Suddivisione in periodi uguali:</label>
        <input type="number" id="intervals" min="1" max="10" value="1">
      </div>

      <div class="control-group">
        <label for="bellSound">Tono campana:</label>
        <select id="bellSound">
          <option value="1">Bell 1 (Default)</option>
          <option value="2">Bell 2</option>
          <option value="3">Bell 3</option>
          <option value="4">Bell 4</option>
          <option value="5">Bell 5</option>
          <option value="6">Bell 6</option>
        </select>
      </div>

      <button class="btn" onclick="startTimer()">Inizia Meditazione</button>
    </div>

    <div id="activeControls" class="card hidden">
      <button class="btn btn-secondary" onclick="stopTimer()">Interrompi</button>
    </div>
  </div>

  <!-- 1. Caricamento del file con i dati delle 16 pratiche -->
  <script src="practices.js"></script>

  <!-- 2. Logica dell'Applicazione -->
  <script>
    let audioCtx = null;
    let timerInterval = null;
    let totalSeconds = 600;
    let prepSeconds = 60;
    let remainingSeconds = 600;
    let currentPhase = 'idle'; // 'prep', 'meditation', 'idle'
    let accumulatedMinutes = 0;
    let intervalMarkers = [];

    // Inizializzazione
    window.addEventListener('DOMContentLoaded', () => {
      loadSettings();
      initPracticesMenu();
      updatePrepMax();
      updateDisplay();
    });

    // Popola il selettore delle pratiche da practices.js
    function initPracticesMenu() {
      const select = document.getElementById('practiceSelect');
      if (typeof MEDITATION_PRACTICES !== 'undefined') {
        MEDITATION_PRACTICES.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p.id;
          opt.textContent = `${p.id}. ${p.summary}`;
          select.appendChild(opt);
        });
      }

      select.addEventListener('change', (e) => {
        const pId = parseInt(e.target.value);
        const guideBox = document.getElementById('guideBox');
        const toggleBtn = document.getElementById('toggleGuideBtn');

        if (pId === 0) {
          guideBox.classList.add('hidden');
          toggleBtn.classList.add('hidden');
        } else {
          const practice = MEDITATION_PRACTICES.find(p => p.id === pId);
          if (practice) {
            const htmlContent = typeof marked !== 'undefined' ? marked.parse(practice.content) : practice.content;
            guideBox.innerHTML = `<h2>${practice.title}</h2>${htmlContent}`;
            toggleBtn.classList.remove('hidden');
          }
        }
      });
    }

    function toggleGuide() {
      const guideBox = document.getElementById('guideBox');
      const btn = document.getElementById('toggleGuideBtn');
      if (guideBox.style.display === 'block') {
        guideBox.style.display = 'none';
        btn.textContent = 'Mostra testo guida';
      } else {
        guideBox.style.display = 'block';
        btn.textContent = 'Nascondi testo guida';
      }
    }

    // Vincolo max 20% tempo di preparazione
    document.getElementById('totalTime').addEventListener('input', () => {
      updatePrepMax();
      saveSettings();
    });

    document.getElementById('prepTime').addEventListener('input', saveSettings);
    document.getElementById('intervals').addEventListener('input', saveSettings);
    document.getElementById('bellSound').addEventListener('change', saveSettings);

    function updatePrepMax() {
      const totalMin = parseInt(document.getElementById('totalTime').value) || 1;
      const maxPrepSec = Math.floor((totalMin * 60) * 0.2);
      const prepInput = document.getElementById('prepTime');
      prepInput.max = maxPrepSec;
      if (parseInt(prepInput.value) > maxPrepSec) {
        prepInput.value = maxPrepSec;
      }
    }

    // Persistenza LocalStorage
    function saveSettings() {
      const settings = {
        totalTime: document.getElementById('totalTime').value,
        prepTime: document.getElementById('prepTime').value,
        intervals: document.getElementById('intervals').value,
        bellSound: document.getElementById('bellSound').value,
        selectedPractice: document.getElementById('practiceSelect').value
      };
      localStorage.setItem('zen_timer_settings', JSON.stringify(settings));
    }

    function loadSettings() {
      const saved = localStorage.getItem('zen_timer_settings');
      if (saved) {
        const s = JSON.parse(saved);
        if (s.totalTime) document.getElementById('totalTime').value = s.totalTime;
        if (s.prepTime) document.getElementById('prepTime').value = s.prepTime;
        if (s.intervals) document.getElementById('intervals').value = s.intervals;
        if (s.bellSound) document.getElementById('bellSound').value = s.bellSound;
        if (s.selectedPractice) {
          document.getElementById('practiceSelect').value = s.selectedPractice;
          document.getElementById('practiceSelect').dispatchEvent(new Event('change'));
        }
      }

      accumulatedMinutes = parseInt(localStorage.getItem('zen_total_minutes') || '0');
      updateStatsBadge();
    }

    function updateStatsBadge() {
      const h = Math.floor(accumulatedMinutes / 60);
      const m = accumulatedMinutes % 60;
      document.getElementById('statsBadge').textContent = `Totale meditato: ${h}h ${m}m`;
    }

    // Web Audio API Synth per Campane Tibetane
    function playBell(volume = 1.0) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const type = document.getElementById('bellSound').value;
      const freqs = {
        '1': [300, 600, 900],
        '2': [220, 440, 660],
        '3': [432, 864],
        '4': [528, 1056],
        '5': [150, 300, 450],
        '6': [600, 1200]
      }[type] || [300, 600];

      freqs.forEach(freq => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        
        gain.gain.setValueAtTime(volume * 0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 4.0);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 4.0);
      });
    }

    // Logica Timer
    function startTimer() {
      const totalMin = parseInt(document.getElementById('totalTime').value);
      prepSeconds = parseInt(document.getElementById('prepTime').value);
      const numIntervals = parseInt(document.getElementById('intervals').value);

      totalSeconds = totalMin * 60;
      remainingSeconds = totalSeconds;

      // Calcolo marcatori intervalli
      const activeMeditationTime = totalSeconds - prepSeconds;
      const intervalDuration = activeMeditationTime / numIntervals;
      intervalMarkers = [];
      for (let i = 1; i < numIntervals; i++) {
        intervalMarkers.push(Math.round(totalSeconds - prepSeconds - (i * intervalDuration)));
      }

      document.getElementById('setupControls').classList.add('hidden');
      document.getElementById('activeControls').classList.remove('hidden');

      playBell(1.0); // Rintocco iniziale
      
      currentPhase = prepSeconds > 0 ? 'prep' : 'meditation';

      timerInterval = setInterval(() => {
        remainingSeconds--;
        
        // Cambio fase da prep a meditazione
        if (currentPhase === 'prep' && remainingSeconds === (totalSeconds - prepSeconds)) {
          currentPhase = 'meditation';
          playBell(1.0); // Rintocco fine preparazione
        }

        // Controllo marcatori di intervallo
        if (currentPhase === 'meditation' && intervalMarkers.includes(remainingSeconds)) {
          playBell(0.5); // Rintocco a metà volume
        }

        if (remainingSeconds <= 0) {
          completeTimer(totalMin);
        }

        updateDisplay();
      }, 1000);

      updateDisplay();
    }

    function stopTimer() {
      clearInterval(timerInterval);
      currentPhase = 'idle';
      document.getElementById('setupControls').classList.remove('hidden');
      document.getElementById('activeControls').classList.add('hidden');
      document.getElementById('phaseLabel').textContent = 'Interrotto';
    }

    function completeTimer(completedMinutes) {
      clearInterval(timerInterval);
      playBell(1.0); // Rintocco finale
      
      accumulatedMinutes += completedMinutes;
      localStorage.setItem('zen_total_minutes', accumulatedMinutes);
      updateStatsBadge();

      currentPhase = 'idle';
      document.getElementById('setupControls').classList.remove('hidden');
      document.getElementById('activeControls').classList.add('hidden');
      document.getElementById('phaseLabel').textContent = 'Completato';
    }

    function updateDisplay() {
      const mins = Math.floor(remainingSeconds / 60);
      const secs = remainingSeconds % 60;
      document.getElementById('timeLeft').textContent = 
        `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

      const label = document.getElementById('phaseLabel');
      const circle = document.getElementById('progressRing');

      if (currentPhase === 'prep') {
        label.textContent = 'Preparazione';
        circle.style.stroke = 'var(--prep-color)';
      } else if (currentPhase === 'meditation') {
        label.textContent = 'Meditazione';
        circle.style.stroke = 'var(--accent)';
      }

      // Anello di avanzamento
      const circumference = 2 * Math.PI * 110;
      const offset = circumference - (remainingSeconds / totalSeconds) * circumference;
      circle.style.strokeDashoffset = offset;
    }

    // Registrazione Service Worker per PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registrato', reg))
          .catch(err => console.error('Errore SW', err));
      });
    }
  </script>
</body>
</html>
