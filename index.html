<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timer Meditazione Zen</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0b0d12;
      --card-bg: #151821;
      --accent: #f39c12;
      --accent-muted: #8a5a00;
      --text: #e0e0e0;
      --text-muted: #7f8c8d;
      --prep-color: #e67e22;
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 5px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 300;
      letter-spacing: 3px;
      color: var(--accent);
      text-transform: uppercase;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .badge {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 12px;
      background: rgba(243, 156, 18, 0.1);
      border: 1px solid var(--accent-muted);
      border-radius: 20px;
      font-size: 0.8rem;
      color: var(--accent);
    }

    .practice-card {
      width: 100%;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    select, input {
      width: 100%;
      padding: 10px;
      background-color: #1c202c;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    select:focus, input:focus {
      border-color: var(--accent);
    }

    .guide-box {
      display: none;
      margin-top: 15px;
      padding: 15px;
      background-color: #10121a;
      border-left: 3px solid var(--accent);
      border-radius: 4px;
      max-height: 250px;
      overflow-y: auto;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .guide-box h2, .guide-box h3 {
      color: var(--accent);
      margin: 10px 0 5px 0;
      font-size: 1.1rem;
    }

    .guide-box ul {
      margin-left: 20px;
      margin-bottom: 10px;
    }

    .timer-display {
      position: relative;
      width: 260px;
      height: 260px;
      margin: 10px 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .progress-ring {
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }

    .progress-ring-circle {
      stroke: var(--accent);
      stroke-dasharray: 722;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 0.5s linear, stroke 0.3s ease;
    }

    .timer-text {
      position: absolute;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .status-tag {
      background: rgba(243, 156, 18, 0.15);
      color: var(--accent);
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .time-left {
      font-size: 3.2rem;
      font-weight: 200;
      letter-spacing: 1px;
      font-family: monospace, sans-serif;
    }

    .info-subtext {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .actions-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin-top: 5px;
    }

    .btn-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background-color: var(--card-bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-circle:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-main {
      padding: 12px 36px;
      border-radius: 25px;
      border: none;
      background-color: var(--accent);
      color: #000;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(243, 156, 18, 0.3);
      transition: transform 0.1s ease, opacity 0.2s;
    }

    .btn-main:hover { opacity: 0.95; }
    .btn-main:active { transform: scale(0.98); }

    .btn-secondary {
      width: 100%;
      padding: 10px;
      background-color: #1c202c;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
      font-size: 0.85rem;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 90%;
      max-width: 420px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .modal-header h2 {
      font-size: 1.1rem;
      font-weight: 400;
      color: var(--accent);
      letter-spacing: 1px;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .prep-adjust { display: flex; gap: 8px; }

    .btn-step {
      padding: 8px 12px;
      background: #1c202c;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .footer-text {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 30px;
      margin-bottom: 10px;
      opacity: 0.7;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Timer Meditazione</h1>
      <div class="subtitle">Presenza e Pace Interiore</div>
      <div id="statsBadge" class="badge">Totale meditato: 0h 0m</div>
    </header>

    <div class="practice-card">
      <div class="control-group">
        <label for="practiceSelect">Scegli una pratica</label>
        <select id="practiceSelect">
          <option value="0">-- Meditazione libera (solo timer) --</option>
        </select>
      </div>
      <button id="toggleGuideBtn" class="btn-secondary hidden" onclick="toggleGuide()">Mostra testo guida</button>
      <div id="guideBox" class="guide-box"></div>
    </div>

    <div class="timer-display">
      <svg class="progress-ring" width="250" height="250">
        <circle class="progress-ring-circle" id="progressRing" stroke-width="4" fill="transparent" r="115" cx="125" cy="125"/>
      </svg>
      <div class="timer-text">
        <div id="statusTag" class="status-tag">PRONTO</div>
        <div id="timeLeft" class="time-left">10:00</div>
        <div id="infoSubtext" class="info-subtext">Prep: 60s | 1 Periodo</div>
      </div>
    </div>

    <div class="actions-bar">
      <button class="btn-circle" title="Reset" onclick="resetTimer()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      </button>

      <button id="startBtn" class="btn-main" onclick="toggleTimer()">
        <span id="playIcon">►</span> <span id="startBtnText">Inizia</span>
      </button>

      <button class="btn-circle" title="Impostazioni" onclick="openSettings()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>

    <footer class="footer-text">
      ABC della meditazione - Modulo C - ILTK Pomaia
    </footer>
  </div>

  <div id="settingsModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h2>CONFIGURAZIONE SESSIONE</h2>
        <button class="close-btn" onclick="closeSettings()">✕</button>
      </div>

      <div class="control-group" style="margin-bottom: 15px;">
        <label for="totalTime">Tempo totale di meditazione (minuti):</label>
        <input type="number" id="totalTime" min="1" max="180" value="10">
      </div>

      <div class="control-group" style="margin-bottom: 15px;">
        <label for="prepTime">Tempo di preparazione (secondi, max 20%):</label>
        <div class="prep-adjust">
          <input type="number" id="prepTime" min="0" step="10" value="60">
          <button class="btn-step" onclick="adjustPrep(-10)">-10s</button>
          <button class="btn-step" onclick="adjustPrep(10)">+10s</button>
        </div>
      </div>

      <div class="control-group" style="margin-bottom: 15px;">
        <label for="intervals">Suddividi meditazione in periodi uguali:</label>
        <input type="number" id="intervals" min="1" max="10" value="1">
      </div>

      <div class="control-group" style="margin-bottom: 15px;">
        <label for="bellSound">Profilo Suono Campana:</label>
        <select id="bellSound">
          <option value="1">Bell 1: Deep Singing Bowl (Default)</option>
          <option value="2">Bell 2: Medium Tibetan Bowl</option>
          <option value="3">Bell 3: High Resonance Chime</option>
          <option value="4">Bell 4: Clear Zen Gong</option>
          <option value="5">Bell 5: Low Frequency Bass</option>
          <option value="6">Bell 6: Bright Temple Bell</option>
        </select>
      </div>

      <button class="btn-main" style="width: 100%; justify-content: center; margin-top: 10px;" onclick="saveAndCloseSettings()">Salva e Chiudi</button>
    </div>
  </div>

  <script src="practices.js"></script>

  <script>
    let audioCtx = null;
    let timerInterval = null;
    let totalSeconds = 600;
    let prepSeconds = 60;
    let remainingSeconds = 600;
    let targetEndTime = null;
    let isRunning = false;
    let currentPhase = 'idle'; 
    let currentPeriod = 0; // Contatore del periodo attuale (1-based)
    let totalPeriods = 1;
    let readingTargetPeriod = 1; // In quale periodo deve avvenire la lettura
    let activeMeditationDuration = 0; // Durata del singolo blocco di meditazione
    let accumulatedMinutes = 0;
    let intervalMarkers = [];
    let wakeLock = null;

    // Gestione Lettura Vocale
    let speechSynth = window.speechSynthesis;
    let speechTimeout = null;
    let isReadingActive = false;

    window.addEventListener('DOMContentLoaded', () => {
      loadSettings();
      initPracticesMenu();
      updatePrepMax();
      resetTimer();
    });

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.warn('Wake Lock rifiutato:', err);
      }
    }

    function releaseWakeLock() {
      if (wakeLock !== null) {
        wakeLock.release().then(() => { wakeLock = null; });
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (wakeLock !== null && document.visibilityState === 'visible' && isRunning) {
        requestWakeLock();
      }
    });

    function initPracticesMenu() {
      const select = document.getElementById('practiceSelect');
      if (typeof MEDITATION_PRACTICES !== 'undefined') {
        MEDITATION_PRACTICES.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p.id;
          opt.textContent = `${p.id}. ${p.summary}`;
          select.appendChild(opt);
        });
      }

      select.addEventListener('change', (e) => {
        const pId = parseInt(e.target.value);
        const guideBox = document.getElementById('guideBox');
        const toggleBtn = document.getElementById('toggleGuideBtn');

        if (pId === 0) {
          guideBox.classList.add('hidden');
          toggleBtn.classList.add('hidden');
        } else {
          const practice = MEDITATION_PRACTICES.find(p => p.id === pId);
          if (practice) {
            const htmlContent = typeof marked !== 'undefined' ? marked.parse(practice.content) : practice.content;
            guideBox.innerHTML = `<h2>${practice.title}</h2>${htmlContent}`;
            toggleBtn.classList.remove('hidden');
          }
        }
        stopGuidedReading();
        saveSettings();
      });
    }

    function toggleGuide() {
      const guideBox = document.getElementById('guideBox');
      const btn = document.getElementById('toggleGuideBtn');
      if (guideBox.style.display === 'block') {
        guideBox.style.display = 'none';
        btn.textContent = 'Mostra testo guida';
      } else {
        guideBox.style.display = 'block';
        btn.textContent = 'Nascondi testo guida';
      }
    }

    function openSettings() { document.getElementById('settingsModal').classList.add('active'); }
    function closeSettings() { document.getElementById('settingsModal').classList.remove('active'); }

    function saveAndCloseSettings() {
      saveSettings();
      resetTimer();
      closeSettings();
    }

    function adjustPrep(amount) {
      const prepInput = document.getElementById('prepTime');
      let val = parseInt(prepInput.value) + amount;
      const maxVal = parseInt(prepInput.max);
      if (val < 0) val = 0;
      if (val > maxVal) val = maxVal;
      prepInput.value = val;
    }

    document.getElementById('totalTime').addEventListener('input', updatePrepMax);

    function updatePrepMax() {
      const totalMin = parseInt(document.getElementById('totalTime').value) || 1;
      const maxPrepSec = Math.floor((totalMin * 60) * 0.2);
      const prepInput = document.getElementById('prepTime');
      prepInput.max = maxPrepSec;
      if (parseInt(prepInput.value) > maxPrepSec) {
        prepInput.value = maxPrepSec;
      }
    }

    function saveSettings() {
      const settings = {
        totalTime: document.getElementById('totalTime').value,
        prepTime: document.getElementById('prepTime').value,
        intervals: document.getElementById('intervals').value,
        bellSound: document.getElementById('bellSound').value,
        selectedPractice: document.getElementById('practiceSelect').value
      };
      localStorage.setItem('zen_timer_settings', JSON.stringify(settings));
    }

    function loadSettings() {
      const saved = localStorage.getItem('zen_timer_settings');
      if (saved) {
        const s = JSON.parse(saved);
        if (s.totalTime) document.getElementById('totalTime').value = s.totalTime;
        if (s.prepTime) document.getElementById('prepTime').value = s.prepTime;
        if (s.intervals) document.getElementById('intervals').value = s.intervals;
        if (s.bellSound) document.getElementById('bellSound').value = s.bellSound;
        if (s.selectedPractice) {
          document.getElementById('practiceSelect').value = s.selectedPractice;
          document.getElementById('practiceSelect').dispatchEvent(new Event('change'));
        }
      }
      accumulatedMinutes = parseInt(localStorage.getItem('zen_total_minutes') || '0');
      updateStatsBadge();
    }

    function updateStatsBadge() {
      const h = Math.floor(accumulatedMinutes / 60);
      const m = accumulatedMinutes % 60;
      document.getElementById('statsBadge').textContent = `Totale meditato: ${h}h ${m}m`;
    }

    function playBell(volume = 1.0) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const type = document.getElementById('bellSound').value;
      const now = audioCtx.currentTime;

      const bellProfiles = {
        '1': { base: 216, partials: [1.0, 2.76, 5.4, 8.9], decay: 6.0 },
        '2': { base: 310, partials: [1.0, 2.71, 5.2, 8.1], decay: 5.0 },
        '3': { base: 432, partials: [1.0, 2.0, 3.01, 4.2], decay: 4.5 },
        '4': { base: 180, partials: [1.0, 1.5, 2.4, 3.8], decay: 7.0 },
        '5': { base: 120, partials: [1.0, 2.1, 3.5, 6.2], decay: 8.0 },
        '6': { base: 528, partials: [1.0, 2.7, 4.8, 7.3], decay: 4.0 }
      };

      const profile = bellProfiles[type] || bellProfiles['1'];
      const masterGain = audioCtx.createGain();
      masterGain.gain.setValueAtTime(volume * 0.4, now);
      masterGain.connect(audioCtx.destination);

      profile.partials.forEach((ratio, index) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        const detune = (index % 2 === 0 ? 0.8 : -0.8) * index;
        const freq = profile.base * ratio;

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq + detune, now);

        const partialDecay = profile.decay / (1 + index * 0.5);
        const initialAmp = 1 / Math.pow(index + 1, 1.2);

        gain.gain.setValueAtTime(initialAmp, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + partialDecay);

        osc.connect(gain);
        gain.connect(masterGain);

        osc.start(now);
        osc.stop(now + partialDecay);
      });
    }

    /* --- MOTORE DI LETTURA GUIDATA TIMED --- */

    function extractBulletPoints(text) {
      const lines = text.split('\n');
      const bullets = [];
      lines.forEach(line => {
        const trimmed = line.trim();
        if (trimmed.startsWith('-') || trimmed.startsWith('*')) {
          const cleanText = trimmed.replace(/^[-\*]\s*/, '').replace(/«|»/g, '').trim();
          if (cleanText) bullets.push(cleanText);
        }
      });
      return bullets;
    }

    function measureSpeechDuration(text) {
      return new Promise(resolve => {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'it-IT';
        u.rate = 0.9;
        const start = performance.now();
        u.onend = () => {
          const duration = (performance.now() - start) / 1000;
          resolve(duration);
        };
        u.onerror = () => resolve(3); // Fallback di stima in caso di errore
        speechSynth.speak(u);
      });
    }

    async function startGuidedReading(blockDurationSec) {
      stopGuidedReading();

      const pId = parseInt(document.getElementById('practiceSelect').value);
      if (pId === 0) return;

      const practice = MEDITATION_PRACTICES.find(p => p.id === pId);
      if (!practice) return;

      const bullets = extractBulletPoints(practice.content);
      if (bullets.length === 0) return;

      isReadingActive = true;

      // 1. Calcola la durata netta della voce per tutti i punti
      let totalSpeechTime = 0;
      const speechDurations = [];

      for (let text of bullets) {
        if (!isReadingActive) return;
        const dur = await measureSpeechDuration(text);
        speechDurations.push(dur);
        totalSpeechTime += dur;
      }

      if (!isReadingActive) return;

      // 2. Calcola lo spazio temporale utile e le pause
      const windowDuration = blockDurationSec - 15; // Lascia 15 secondi finali
      const totalPauseTime = windowDuration - totalSpeechTime;
      
      const numGaps = bullets.length - 1;
      const pauseInterval = numGaps > 0 ? Math.max(1, totalPauseTime / numGaps) : 0;

      // 3. Sequenza di riproduzione temporizzata
      speakBulletSequence(bullets, pauseInterval, 0);
    }

    function speakBulletSequence(bullets, pauseSec, index) {
      if (index >= bullets.length || !isReadingActive || !isRunning) return;

      const u = new SpeechSynthesisUtterance(bullets[index]);
      u.lang = 'it-IT';
      u.rate = 0.9;

      u.onend = () => {
        if (index < bullets.length - 1 && isReadingActive && isRunning) {
          speechTimeout = setTimeout(() => {
            speakBulletSequence(bullets, pauseSec, index + 1);
          }, pauseSec * 1000);
        }
      };

      u.onerror = () => {
        if (index < bullets.length - 1 && isReadingActive && isRunning) {
          speechTimeout = setTimeout(() => {
            speakBulletSequence(bullets, pauseSec, index + 1);
          }, pauseSec * 1000);
        }
      };

      speechSynth.speak(u);
    }

    function stopGuidedReading() {
      isReadingActive = false;
      if (speechTimeout) clearTimeout(speechTimeout);
      if (speechSynth) speechSynth.cancel();
    }

    /* --- LOGICA DEL TIMER --- */

    function toggleTimer() {
      if (isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    }

    function startTimer() {
      isRunning = true;
      document.getElementById('playIcon').textContent = '❚❚';
      document.getElementById('startBtnText').textContent = 'Pausa';
      requestWakeLock();

      if (currentPhase === 'idle') {
        const totalMin = parseInt(document.getElementById('totalTime').value);
        prepSeconds = parseInt(document.getElementById('prepTime').value);
        totalPeriods = parseInt(document.getElementById('intervals').value);

        totalSeconds = totalMin * 60;
        remainingSeconds = totalSeconds;

        const activeMeditationTime = totalSeconds - prepSeconds;
        activeMeditationDuration = activeMeditationTime / totalPeriods;

        // Determina il periodo bersaglio per la lettura
        readingTargetPeriod = totalPeriods === 1 ? 1 : 2;

        intervalMarkers = [];
        for (let i = 1; i < totalPeriods; i++) {
          intervalMarkers.push(Math.round(totalSeconds - prepSeconds - (i * activeMeditationDuration)));
        }

        currentPhase = prepSeconds > 0 ? 'prep' : 'meditation';
        currentPeriod = currentPhase === 'meditation' ? 1 : 0;
        playBell(1.0);

        // Se non c'è preparazione e il blocco bersaglio è il primo, avvia la lettura subito
        if (currentPhase === 'meditation' && currentPeriod === readingTargetPeriod) {
          startGuidedReading(activeMeditationDuration);
        }
      } else if (isReadingActive) {
        speechSynth.resume();
      }

      targetEndTime = Date.now() + (remainingSeconds * 1000);

      timerInterval = setInterval(() => {
        const now = Date.now();
        const newRemaining = Math.max(0, Math.round((targetEndTime - now) / 1000));

        if (newRemaining !== remainingSeconds) {
          remainingSeconds = newRemaining;

          // Transizione da Preparazione a Meditazione (Periodo 1)
          if (currentPhase === 'prep' && remainingSeconds <= (totalSeconds - prepSeconds)) {
            currentPhase = 'meditation';
            currentPeriod = 1;
            playBell(1.0);

            if (currentPeriod === readingTargetPeriod) {
              startGuidedReading(activeMeditationDuration);
            }
          }

          // Rintocco Intervallo / Passaggio al Periodo Successivo
          if (currentPhase === 'meditation' && intervalMarkers.includes(remainingSeconds)) {
            playBell(0.5);
            currentPeriod++;

            if (currentPeriod === readingTargetPeriod) {
              startGuidedReading(activeMeditationDuration);
            }
          }

          if (remainingSeconds <= 0) {
            completeTimer();
          }

          updateDisplay();
        }
      }, 500);

      updateDisplay();
    }

    function pauseTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      releaseWakeLock();
      if (speechSynth) speechSynth.pause();
      document.getElementById('playIcon').textContent = '►';
      document.getElementById('startBtnText').textContent = 'Riprendi';
      document.getElementById('statusTag').textContent = 'PAUSA';
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      currentPhase = 'idle';
      currentPeriod = 0;
      releaseWakeLock();
      stopGuidedReading();

      const totalMin = parseInt(document.getElementById('totalTime').value) || 10;
      prepSeconds = parseInt(document.getElementById('prepTime').value) || 0;
      totalSeconds = totalMin * 60;
      remainingSeconds = totalSeconds;

      document.getElementById('playIcon').textContent = '►';
      document.getElementById('startBtnText').textContent = 'Inizia';
      document.getElementById('statusTag').textContent = 'PRONTO';
      document.getElementById('statusTag').style.background = 'rgba(243, 156, 18, 0.15)';
      document.getElementById('statusTag').style.color = 'var(--accent)';

      updateDisplay();
    }

    function completeTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      releaseWakeLock();
      stopGuidedReading();
      playBell(1.0);

      const completedMinutes = parseInt(document.getElementById('totalTime').value);
      accumulatedMinutes += completedMinutes;
      localStorage.setItem('zen_total_minutes', accumulatedMinutes);
      updateStatsBadge();

      currentPhase = 'idle';
      currentPeriod = 0;
      document.getElementById('playIcon').textContent = '►';
      document.getElementById('startBtnText').textContent = 'Inizia';
      document.getElementById('statusTag').textContent = 'COMPLETATO';
      
      remainingSeconds = 0;
      updateDisplay();
    }

    function updateDisplay() {
      const mins = Math.floor(remainingSeconds / 60);
      const secs = remainingSeconds % 60;
      document.getElementById('timeLeft').textContent = 
        `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

      const tag = document.getElementById('statusTag');
      const circle = document.getElementById('progressRing');
      const numIntervals = parseInt(document.getElementById('intervals').value) || 1;

      document.getElementById('infoSubtext').textContent = 
        `Prep: ${prepSeconds}s | ${numIntervals} Periodo/i`;

      if (currentPhase === 'prep') {
        tag.textContent = 'PREPARAZIONE';
        tag.style.background = 'rgba(230, 126, 34, 0.2)';
        tag.style.color = 'var(--prep-color)';
        circle.style.stroke = 'var(--prep-color)';
      } else if (currentPhase === 'meditation') {
        tag.textContent = `MEDITAZIONE (${currentPeriod}/${numIntervals})`;
        tag.style.background = 'rgba(243, 156, 18, 0.2)';
        tag.style.color = 'var(--accent)';
        circle.style.stroke = 'var(--accent)';
      }

      const circumference = 2 * Math.PI * 115;
      const offset = circumference - (remainingSeconds / totalSeconds) * circumference;
      circle.style.strokeDashoffset = isNaN(offset) ? 0 : offset;
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registrato', reg))
          .catch(err => console.error('Errore SW', err));
      });
    }
  </script>
</body>
